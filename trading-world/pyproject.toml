[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeworld"
version = "0.1.0"
description = "Deterministic multi-agent trading simulation world with a separate learning layer"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyarrow>=14", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]
# Phase 2 learning (install torch CPU wheels from https://download.pytorch.org/whl/cpu)
learn = ["gymnasium>=1.0", "torch>=2.2", "stable-baselines3>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["benchmark: performance benchmark (test group 15)"]
