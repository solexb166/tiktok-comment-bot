[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeworld"
version = "0.1.0"
description = "Deterministic multi-agent trading simulation world (Phase 1: simulator, no learning)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.0", "pyarrow>=14", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["benchmark: performance benchmark (test group 15)"]
